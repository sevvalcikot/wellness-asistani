# Yedek adres: siteyi GitHub Pages'te de yayınlar
# (https://sevvalcikot.github.io/wellness-asistani/)
# main dalına her gönderimde kendiliğinden çalışır.
# Not: GitHub Pages'te sunucu fonksiyonu (api/) çalışmaz; yapay zeka kısmı
# orada her zaman hazır cevaplarla çalışır. Hesap sistemi (Supabase) normal çalışır.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: dagitim
        uses: actions/deploy-pages@v4
